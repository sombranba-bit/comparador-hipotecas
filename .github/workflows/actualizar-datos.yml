name: Actualizar datos de hipotecas

on:
  schedule:
    - cron: "17 6 * * *"   # cada día a las 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar indicadores del BCE
        run: node scripts/update-data.mjs

      - name: Guardar cambios si los hay
        run: |
          if git diff --quiet -- data/; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference.json
          git commit -m "Actualiza indicadores del BCE"
          git push
